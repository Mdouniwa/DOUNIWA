<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuro·console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kuro.css">
<script src="kuro.js"></script>
</head>
<body>
<div class="app">
  <div class="noise"></div>
  <header class="bar">
    <div class="logo">
      <div class="logo-box">❯</div>
      <div class="logo-text">kuro<span>·console</span></div>
      <div class="ver">v0.5.0</div>
    </div>
    <nav class="tabs">
      <span class="tab active">CHAT</span>
      <a class="tab" href="tasks.html">TASKS</a>
    </nav>
    <div class="pills" id="modelPills"></div>
    <div class="head-right">
      <div class="status">
        <span class="dot idle" id="statusDot"></span>
        <span class="status-label idle" id="statusLabel">待機</span>
      </div>
      <div class="metrics" id="metrics"></div>
    </div>
  </header>
  <div class="body-row">
    <aside class="sidebar">
      <button class="new-conv" id="newSession"><span class="new-conv-plus">＋</span> 新しい会話</button>
      <div class="sidebar-label">CONVERSATIONS</div>
      <div class="conv-list" id="convList"></div>
    </aside>
    <div class="chat-col">
      <main class="scroll" id="main">
        <div class="wrap" id="messages"></div>
      </main>
      <footer class="bar">
        <div class="input-row">
          <div class="input-wrap">
            <span class="prompt-char">❯</span>
            <input id="input" placeholder="メッセージを入力" autocomplete="off">
          </div>
          <button class="send" id="send">↑</button>
        </div>
        <div class="foot-note">
          <span>local inference · telemetry off</span>
          <span>enter ↵ 送信</span>
        </div>
      </footer>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = {
    model: null, models: [], busy: false,
    session: localStorage.getItem('kuro.session') || null,  // null = 未保存の新規会話
    sessions: [],
    armedSid: null,   // 削除2段階目待ちの会話ID
    armTimer: null,
  };
  const POLL_MS = 3000;

  function setSession(sid) {
    state.session = sid;
    if (sid) localStorage.setItem('kuro.session', sid);
    else localStorage.removeItem('kuro.session');
  }

  function scrollDown() {
    requestAnimationFrame(() => { $('main').scrollTop = $('main').scrollHeight; });
  }

  function addMsg(role, text, meta) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (role === 'user' ? ' user' : '');
    row.innerHTML =
      '<div class="msg-meta">' + KURO.esc(meta) + '</div>' +
      '<div class="bubble">' + KURO.esc(text) + '</div>';
    $('messages').appendChild(row);
    scrollDown();
    return row;
  }

  function addTyping(label) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typingRow';
    row.innerHTML =
      '<div class="msg-meta">' + KURO.esc(label) + ' · 生成中</div>' +
      '<div class="typing"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div>';
    $('messages').appendChild(row);
    scrollDown();
  }

  function removeTyping() {
    const el = $('typingRow');
    if (el) el.remove();
  }

  function renderPills() {
    const box = $('modelPills');
    box.innerHTML = '';
    const order = ['qwen-35b', 'gemma-31b', 'gemma-26b'];
    const items = order
      .map(n => state.models.find(m => m.name === n))
      .filter(Boolean)
      .map(m => ({ name: m.name, label: m.label }));
    items.push({ name: null, label: '自動選択' });
    for (const it of items) {
      const b = document.createElement('button');
      b.className = 'pill' + (state.model === it.name ? ' active' : '');
      b.textContent = it.label;
      b.onclick = () => { state.model = it.name; renderPills(); };
      box.appendChild(b);
    }
  }

  // ---- サイドバー（会話一覧） ----------------------------------------

  function disarmDelete() {
    state.armedSid = null;
    clearTimeout(state.armTimer);
  }

  async function deleteSession(sid) {
    try {
      await KURO.json('/api/sessions/' + encodeURIComponent(sid), { method: 'DELETE' });
      if (state.session === sid) {
        setSession(null);
        await loadHistory();
      }
      await refreshSessions();
    } catch (e) {
      addMsg('ai', '削除に失敗しました: ' + e.message, 'system');
    }
  }

  function convItem(s) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (s.session_id === state.session ? ' active' : '');
    const armed = state.armedSid === s.session_id;
    item.innerHTML =
      '<div class="conv-title">' + KURO.esc(s.title || '（無題）') + '</div>' +
      '<div class="conv-meta"><span>' + s.count + '件 · ' +
      KURO.esc((s.last_at || '').slice(5, 10).replace('-', '/')) + '</span>' +
      '<span class="conv-del' + (armed ? ' armed' : '') + '">' +
      (armed ? '本当に削除?' : '削除') + '</span></div>';
    item.onclick = async () => {
      disarmDelete();
      setSession(s.session_id);
      await refreshSessions();
      await loadHistory();
    };
    // 削除は2段階（1回目で警告状態、3秒以内の2回目で実行）。confirm() は使わない。
    item.querySelector('.conv-del').onclick = async (e) => {
      e.stopPropagation();
      if (state.armedSid !== s.session_id) {
        disarmDelete();
        state.armedSid = s.session_id;
        state.armTimer = setTimeout(() => { disarmDelete(); renderConvList(); }, 3000);
        renderConvList();
        return;
      }
      disarmDelete();
      await deleteSession(s.session_id);
    };
    return item;
  }

  function renderConvList() {
    const list = $('convList');
    list.innerHTML = '';
    if (!state.sessions.length) {
      const empty = document.createElement('div');
      empty.className = 'conv-empty';
      empty.textContent = 'まだ会話がありません';
      list.appendChild(empty);
      return;
    }
    for (const s of state.sessions) list.appendChild(convItem(s));
  }

  async function refreshSessions() {
    try {
      const data = await KURO.json('/api/sessions');
      state.sessions = data.sessions;
    } catch { state.sessions = []; }
    renderConvList();
  }

  // ---- チャット -------------------------------------------------------

  async function loadHistory() {
    $('messages').innerHTML = '';
    if (!state.session) return;  // 新規会話は空から始める
    try {
      const data = await KURO.json('/api/sessions/' + encodeURIComponent(state.session));
      for (const m of data.messages) {
        addMsg('user', m.task_text, 'you · ' + m.time);
        addMsg('ai', m.llm_output, m.model + ' · ' + m.time + (m.stubbed ? ' · stub' : ''));
      }
    } catch (e) { /* 履歴なしは許容 */ }
  }

  async function pollRun(runId) {
    for (;;) {
      await new Promise(r => setTimeout(r, POLL_MS));
      let run;
      try { run = await KURO.json('/api/runs/' + runId); }
      catch { continue; }
      if (run.status === 'running') continue;
      removeTyping();
      if (run.record_id && run.llm_output != null) {
        const meta = (run.model_name || 'ai') + ' · ' +
          new Date().toTimeString().slice(0, 5) + (run.stubbed ? ' · stub' : '');
        addMsg('ai', run.llm_output, meta);
      } else {
        addMsg('ai', '実行に失敗しました: ' + (run.error || '不明なエラー'), 'system');
      }
      return;
    }
  }

  async function send() {
    const text = $('input').value.trim();
    if (!text || state.busy) return;
    state.busy = true;
    $('send').classList.add('flash');
    setTimeout(() => $('send').classList.remove('flash'), 220);
    addMsg('user', text, 'you · ' + new Date().toTimeString().slice(0, 5));
    $('input').value = '';
    const label = state.model || '自動選択';
    addTyping(label);
    try {
      const res = await KURO.json('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text, model: state.model, session_id: state.session,
        }),
      });
      if (res.session_id && res.session_id !== state.session) {
        setSession(res.session_id);  // 新規会話の初回送信でIDが確定する
      }
      await pollRun(res.run_id);
      refreshSessions();
    } catch (e) {
      removeTyping();
      addMsg('ai', 'リクエストに失敗しました: ' + e.message, 'system');
    } finally {
      state.busy = false;
    }
  }

  async function tickHealth() {
    const h = await KURO.health();
    KURO.applyHealth(h, $('statusDot'), $('statusLabel'));
    $('metrics').textContent = h.endpoint_configured
      ? (h.default_model + ' · local' + (h.llm_up ? '' : ' · unreachable'))
      : 'llm未設定 · stub';
  }

  $('send').onclick = send;
  // IME変換確定のEnterでは送信しない。isComposing に加え、確定直後に
  // keydown が届くブラウザ向けに keyCode 229 と composition 区間も見る。
  let composing = false;
  $('input').addEventListener('compositionstart', () => { composing = true; });
  $('input').addEventListener('compositionend', () => { composing = false; });
  $('input').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.isComposing || e.keyCode === 229 || composing) return;
    send();
  });

  $('newSession').onclick = async () => {
    disarmDelete();
    setSession(null);
    await refreshSessions();
    await loadHistory();
  };

  (async () => {
    try {
      const data = await KURO.json('/api/models');
      state.models = data.models;
    } catch { state.models = []; }
    renderPills();
    tickHealth();
    setInterval(tickHealth, 5000);
    await refreshSessions();
    await loadHistory();
  })();
})();
</script>
</body>
</html>
